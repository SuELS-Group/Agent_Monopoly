<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test WebSocket Monopoly</title>
    <style>
        body { font-family: monospace; background: #1e1e1e; color: #d4d4d4; padding: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #007acc; color: white; border: none; border-radius: 5px; }
        button:hover { background: #005f9e; }
        #status { margin-bottom: 20px; font-weight: bold; }
        .connected { color: #4CAF50; }
        .disconnected { color: #f44336; }
        pre { background: #2d2d2d; padding: 15px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>

    <h2>Simulation Microscope (WebSocket Test)</h2>
    <div id="status" class="disconnected">🔴 Disconnected</div>
    
    <button id="next-turn-btn" disabled>👉 Run Next Turn</button>
    
    <h3>Live data stream (JSON):</h3>
    <pre id="json-output">Waiting for data...</pre>

    <script>
        // 1. Connect to the FastAPI server
        const ws = new WebSocket("ws://127.0.0.1:8000/ws/simulation");
        const statusDiv = document.getElementById("status");
        const btn = document.getElementById("next-turn-btn");
        const output = document.getElementById("json-output");

        // 2. WebSocket event handling
        ws.onopen = function(event) {
            statusDiv.innerHTML = "🟢 Connected to the Monopoly Engine";
            statusDiv.className = "connected";
            btn.disabled = false;
        };

        ws.onmessage = function(event) {
            // Pretty-print the received JSON
            const data = JSON.parse(event.data);
            output.innerHTML = JSON.stringify(data, null, 4);
        };

        ws.onclose = function(event) {
            statusDiv.innerHTML = "🔴 Disconnected (is the server down?)";
            statusDiv.className = "disconnected";
            btn.disabled = true;
        };

        // 3. Send the action command to the Engine
        btn.onclick = function() {
            ws.send("NEXT_TURN");
        };
    </script>
</body>
</html>
